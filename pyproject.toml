[project]
name = "gor-caf"
version = "0.1.0"
description = "Geometric Occupancy Rule (GOR) verification via Canonical Anchor Fit (CAF)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100